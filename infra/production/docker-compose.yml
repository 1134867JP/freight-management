services:
  app-fpm:
    build:
      context: ../..
      dockerfile: infra/production/images/Dockerfile
      target: php-fpm
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_URL: ${APP_PUBLIC_URL}
      DB_CONNECTION: pgsql
      DB_HOST: app-postgres
      DB_PORT: 5432
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      EVOLUTION_BASE_URL: http://evolution-api:8080
      WAIT_FOR_DB: "true"
      APP_RUN_OPTIMIZE: "true"
      REDIS_HOST: app-redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      app-postgres:
        condition: service_healthy
      app-redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage

  app-queue:
    image: ${APP_IMAGE}
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--queue=default", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
    env_file:
      - ./.env
    environment:
      APP_URL: ${APP_PUBLIC_URL}
      DB_CONNECTION: pgsql
      DB_HOST: app-postgres
      DB_PORT: 5432
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      EVOLUTION_BASE_URL: http://evolution-api:8080
      WAIT_FOR_DB: "true"
      APP_RUN_OPTIMIZE: "true"
      REDIS_HOST: app-redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      app-postgres:
        condition: service_healthy
      app-redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage

  app-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - app_postgres_data:/var/lib/postgresql/data

  app-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - app_redis_data:/data

  evolution-api:
    profiles: [evolution]
    image: ${EVOLUTION_API_IMAGE}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SERVER_TYPE: https
      SERVER_URL: ${EVOLUTION_PUBLIC_URL}
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    profiles: [evolution]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_DATABASE}
      POSTGRES_USER: ${EVOLUTION_DB_USERNAME}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USERNAME} -d ${EVOLUTION_DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  evolution-redis:
    profiles: [evolution]
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - evolution_redis_data:/data

  web:
    build:
      context: ../..
      dockerfile: infra/production/images/Dockerfile
      target: nginx
    image: ${WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      app-fpm:
        condition: service_started
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      EVOLUTION_DOMAIN: ${EVOLUTION_DOMAIN}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      EVOLUTION_PUBLIC_URL: ${EVOLUTION_PUBLIC_URL}
      APP_TLS_CERT: ${APP_TLS_CERT}
      APP_TLS_KEY: ${APP_TLS_KEY}
      EVOLUTION_TLS_CERT: ${EVOLUTION_TLS_CERT}
      EVOLUTION_TLS_KEY: ${EVOLUTION_TLS_KEY}
      NGINX_AUTO_SELF_SIGNED: ${NGINX_AUTO_SELF_SIGNED}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE}
    ports:
      - "${APP_PORT_HTTP}:8080"
      - "${APP_PORT_HTTPS}:8443"
      - "${EVOLUTION_PORT_HTTP}:8088"
      - "${EVOLUTION_PORT_HTTPS}:8444"
    volumes:
      - ./certs:/etc/nginx/certs
      - app_storage:/var/www/html/storage:ro

volumes:
  app_postgres_data:
  app_redis_data:
  app_storage:
  evolution_instances:
  evolution_postgres_data:
  evolution_redis_data:
