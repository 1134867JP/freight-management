name: Deploy Freight Management

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          connect_timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            APP_DIR=/opt/apps/outro-site/freight-management
            cd $APP_DIR

            echo "==> Atualizando codigo..."
            git pull origin main

            echo "==> Buildando imagem Docker..."
            docker build --target php-fpm -t freight-management-app:latest \
              -f $APP_DIR/infra/production/images/Dockerfile \
              $APP_DIR

            echo "==> Reiniciando servicos..."
            cd $APP_DIR/infra/production
            docker compose up -d --force-recreate app-fpm app-queue app-scheduler

            echo "==> Aguardando app subir..."
            sleep 5

            echo "==> Rodando migrations e caches..."
            docker exec freight-app php artisan migrate --force
            docker exec freight-app php artisan config:cache
            docker exec freight-app php artisan route:cache
            docker exec freight-app php artisan view:cache

            echo "==> Deploy concluido com sucesso!"
