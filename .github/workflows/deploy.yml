name: Deploy Freight Management

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: freight_test
          POSTGRES_USER: freight_user
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env and generate key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure test database
        run: |
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=freight_test" >> .env
          echo "DB_USERNAME=freight_user" >> .env
          echo "DB_PASSWORD=secret" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 3m
          command_timeout: 20m
          script: |
            set -e
            APP_DIR=/opt/apps/outro-site/freight-management
            cd $APP_DIR

            echo "==> Atualizando codigo..."
            git pull origin main

            echo "==> Build dos assets frontend..."
            docker run --rm \
              -v $APP_DIR:/app \
              -w /app \
              node:20-alpine sh -c "npm ci && npm run build"

            echo "==> Reiniciando servicos..."
            docker compose up -d --remove-orphans --force-recreate

            echo "==> Aguardando app subir..."
            sleep 5

            echo "==> Instalando dependencias PHP..."
            docker run --rm \
              -v $APP_DIR:/app \
              -v /tmp/composer-cache:/tmp/cache \
              composer:2 install --no-interaction --prefer-dist --optimize-autoloader --no-dev --working-dir=/app

            echo "==> Ajustando permissoes..."
            docker exec -u root freight-app chmod -R 775 storage bootstrap/cache
            docker exec -u root freight-app chown -R www-data:www-data storage bootstrap/cache

            echo "==> Rodando migrations e caches..."
            docker exec freight-app php artisan migrate --force
            docker exec freight-app php artisan config:cache
            docker exec freight-app php artisan route:cache
            docker exec freight-app php artisan view:cache

            echo "==> Deploy concluido com sucesso!"
