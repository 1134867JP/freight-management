services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freight_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: freight_management
      DB_USERNAME: freight
      DB_PASSWORD: freight
      QUEUE_CONNECTION: database
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: freight_postgres
    environment:
      POSTGRES_DB: freight_management
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: freight
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freight -d freight_management']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
