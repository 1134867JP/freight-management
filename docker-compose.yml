services:
  app:
    build:
      context: /opt/apps/outro-site
      dockerfile: Dockerfile
    restart: always
    working_dir: /var/www/html
    volumes:
      - /opt/apps/outro-site:/var/www/html
    depends_on:
      - db
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: outro_site
      DB_USERNAME: outro_user
      DB_PASSWORD: senha_forte
      QUEUE_CONNECTION: database

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: outro_site
      POSTGRES_USER: outro_user
      POSTGRES_PASSWORD: senha_forte
    volumes:
      - pgdata:/var/lib/postgresql/data

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - /opt/apps/outro-site/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
