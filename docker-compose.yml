services:
  app:
    image: freight-management-app
    container_name: freight-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://72.60.254.178.nip.io
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: freight_db
      DB_USERNAME: freight_user
      DB_PASSWORD: freight_pass_2024
    volumes:
      - /opt/apps/outro-site/freight-management:/var/www/html
    networks:
      - freight-management_internal
      - web

  db:
    image: postgres:16
    container_name: freight-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: freight_db
      POSTGRES_USER: freight_user
      POSTGRES_PASSWORD: freight_pass_2024
    volumes:
      - freight-management_freight_pgdata:/var/lib/postgresql/data
    networks:
      - freight-management_internal

volumes:
  freight-management_freight_pgdata:
    external: true

networks:
  freight-management_internal:
    external: true
  web:
    external: true
