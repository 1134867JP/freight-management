envVarGroups:
  - name: freight-management-shared
    envVars:
      - key: APP_NAME
        value: Freight Management
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: pt
      - key: APP_FALLBACK_LOCALE
        value: pt
      - key: APP_FAKER_LOCALE
        value: pt_BR
      - key: APP_MAINTENANCE_DRIVER
        value: file
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: single
      - key: LOG_LEVEL
        value: info
      - key: TRUSTED_PROXIES
        value: "*"
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: redis
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: QUEUE_CONNECTION
        value: redis
      - key: CACHE_STORE
        value: redis
      - key: REDIS_CLIENT
        value: predis
      - key: FILESYSTEM_DISK
        value: public
      - key: MAIL_MAILER
        value: log
      - key: EVOLUTION_ENABLED
        value: "false"
      - key: EVOLUTION_TIMEOUT
        value: "10"
      - key: WAIT_FOR_DB
        value: "true"
      - key: APP_RUN_OPTIMIZE
        value: "true"

services:
  - type: web
    name: freight-management-web
    runtime: docker
    dockerfilePath: ./infra/render/Dockerfile.web
    dockerContext: .
    plan: starter
    region: ohio
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    autoDeploy: true
    disk:
      name: storage
      mountPath: /var/www/html/storage
      sizeGB: 5
    envVars:
      - fromGroup: freight-management-shared
      - key: APP_KEY
        sync: false
      - key: PORT
        value: "10000"
      - key: APP_URL
        sync: false
      - key: DB_URL
        fromDatabase:
          name: freight-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: freight-management-redis
          property: connectionString
      # Variáveis Reverb (definir manualmente no dashboard do Render após reverb:install)
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_HOST
        sync: false
      - key: REVERB_PORT
        value: "8080"
      - key: REVERB_SCHEME
        value: https

  - type: worker
    name: freight-management-worker
    runtime: docker
    dockerfilePath: ./infra/render/Dockerfile.worker
    dockerContext: .
    plan: starter
    region: ohio
    autoDeploy: true
    envVars:
      - fromGroup: freight-management-shared
      - key: APP_KEY
        sync: false
      - key: DB_URL
        fromDatabase:
          name: freight-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: freight-management-redis
          property: connectionString

  - type: worker
    name: freight-management-reverb
    runtime: docker
    dockerfilePath: ./infra/render/Dockerfile.worker
    dockerContext: .
    plan: starter
    region: ohio
    autoDeploy: true
    # Comando sobrescrito pelo render; alterar o entrypoint ou usar CMD no Dockerfile.worker
    startCommand: php artisan reverb:start --host=0.0.0.0 --port=8080
    envVars:
      - fromGroup: freight-management-shared
      - key: APP_KEY
        sync: false
      - key: DB_URL
        fromDatabase:
          name: freight-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: freight-management-redis
          property: connectionString
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false

databases:
  - name: freight-management-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
    databaseName: freight_management
    user: freight_management
    ipAllowList: []

  - type: redis
    name: freight-management-redis
    plan: free
    region: ohio
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
